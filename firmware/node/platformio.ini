; VIGIL sensor node: ESP32-S3 with 8 MB octal PSRAM (ESP32-S3-DevKitC-1-N8R8)
; and ST IIS3DWB on SPI. The snapshot buffers live in PSRAM.
[env:vigil-node]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -O2
lib_deps =
    h2zero/NimBLE-Arduino@1.4.2
    symlink://../core
monitor_speed = 115200
